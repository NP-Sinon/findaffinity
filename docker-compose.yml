version: '3.8'

services:
  findaffinity:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: findaffinity-saas
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./output_pilot:/app/output_pilot
    environment:
      - DATABASE_URL=sqlite:////app/data/findaffinity.db
      - JWT_SECRET_KEY=findaffinity-production-secret-key-2026
      - ACCESS_TOKEN_EXPIRE_MINUTES=480
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
