# ==============================================================================
# FICHERO: render.yaml
# Despliegue Cloud en Render conectado a Supabase PostgreSQL
# ==============================================================================
services:
  - type: web
    name: findaffinity-saas
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@findaffinity.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: DEFAULT_TENANT_PLAN
        value: FREE
      - key: SEED_DEMO_DATA
        value: "false"
